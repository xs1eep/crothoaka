version: 2

project_name: crothoaka

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - id: crothoaka
    main: ./cmd
    binary: crothoaka
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

# Fuse darwin/amd64 and darwin/arm64 into a single universal binary, so macOS
# users get one file that runs natively on both Intel and Apple Silicon.
universal_binaries:
  - replace: true

archives:
  - formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^ci:"

release:
  draft: false
  prerelease: auto

snapshot:
  version_template: "{{ incpatch .Version }}-next"
