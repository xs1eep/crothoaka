name: ci

on:
  push:
    branches:
      - master
      - dev_simple_tui
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            ext: ""
          - os: macos-latest
            ext: ""
          - os: windows-latest
            ext: ".exe"
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      # Build into RUNNER_TEMP: a bare `go build ./cmd` would try to write a
      # binary named "cmd", which already exists as a directory.
      - name: Build
        run: go build -o "${{ runner.temp }}/crothoaka${{ matrix.ext }}" ./cmd
